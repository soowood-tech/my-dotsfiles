# ==============================================================================
# Hyprlock Configuration - Smooth Clock Animation, Blurred Background & Rounded Input
# ==============================================================================

# Default fallback colors
$accent = rgba(80beefee)
$accent2 = rgba(c85af0ee)
$accent_inactive = rgba(25253555)

# Source dynamic colors generated from current wallpaper
source = ~/.config/hypr/colors.conf

# General Settings
general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

# Smooth Animations
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1

    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 4, easeOutQuint
    animation = inputFieldFade, 1, 4, easeOutQuint
    animation = inputFieldWidth, 1, 4, easeOutQuint
    animation = inputFieldDots, 1, 3, easeOutQuint
    animation = inputFieldColors, 1, 4, easeOutQuint
}

# Background with GPU Blur
background {
    monitor =
    path = screenshot
    color = rgba(10, 12, 18, 1.0)

    # Blur filters
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.22
    vibrancy_darkness = 0.15
}

# Lock Icon Indicator
label {
    monitor =
    text = 󰌾
    color = $accent
    font_size = 32
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Big Minimalist Clock
label {
    monitor =
    text = $TIME
    color = rgba(245, 245, 255, 0.95)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 70
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.7)
}

# Date (Localized Russian)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(205, 210, 225, 0.85)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Idle prompt hint
label {
    monitor =
    text = Начните вводить пароль для разблокировки
    color = rgba(180, 185, 205, 0.55)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 35
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Rounded Input Field with Dots (appears smoothly on typing)
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25         # Dots scale
    dots_spacing = 0.22      # Dots spacing
    dots_center = true
    dots_rounding = -1       # Full circle dots

    outer_color = $accent
    inner_color = rgba(15, 17, 24, 0.75)
    font_color = rgb(235, 238, 250)

    fade_on_empty = true     # Hidden when empty, appears smoothly when typing password
    fade_timeout = 1500

    placeholder_text = <i><span foreground="##99a0b5">Введите пароль...</span></i>
    hide_input = false
    rounding = 25            # Rounded window shape

    check_color = $accent2
    fail_color = rgb(255, 80, 80)
    fail_text = <i><span foreground="##ff5555">Неверный пароль ($ATTEMPTS)</span></i>

    position = 0, 75
    halign = center
    valign = bottom

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.6)
}
