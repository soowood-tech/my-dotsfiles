# ==============================================================================
# Hyprland Configuration with Dynamic Wallpaper Colors & Modern Blur/Transparency
# ==============================================================================

# Source dynamically generated colors
source = ~/.config/hypr/colors.conf

# Monitor Configuration
monitor=,preferred,auto,1

# Autostart essential daemons
exec-once = waybar &
exec-once = ~/.config/hypr/scripts/wall.sh --restore &
exec-once = dunst || mako &
exec-once = ~/.config/hypr/scripts/layout_notify.sh &
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/lib/polkit-kde-authentication-agent-1 &

# Set programs that you use
$terminal = foot
$fileManager = nautilus
$browser = google-chrome-stable
$menu = pkill rofi || rofi -show drun

# Environment variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*

# Input Configuration
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# General Layout & Borders
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $accent $accent2 45deg
    col.inactive_border = $accent_inactive

    layout = dwindle
    allow_tearing = false
}

# Decoration: Rounding, Transparency, Shadows and Blur
decoration {
    rounding = 12

    active_opacity = 0.95
    inactive_opacity = 0.88

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.02
        contrast = 1.05
        brightness = 0.9
        vibrancy = 0.35
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(00000088)
        color_inactive = rgba(00000044)
    }
}

# Animations
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.13, 0.99, 0.29, 1.1

    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 8, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, myBezier, slide
}

# Dwindle Layout
dwindle {
    preserve_split = true
}

# Window Rules for Opacity, Blur & Floating
windowrule = opacity 0.82 0.75, match:class foot
windowrule = opacity 0.82 0.75, match:class kitty
windowrule = opacity 0.82 0.75, match:class Alacritty
windowrule = opacity 0.90 0.82, match:class nautilus
windowrule = opacity 0.90 0.82, match:class thunar
windowrule = opacity 0.88 0.80, match:class rofi

# Floating window rules
windowrule = float 1, match:class float-term
windowrule = size 950 550, match:class float-term
windowrule = center 1, match:class float-term

windowrule = float 1, match:class pavucontrol
windowrule = float 1, match:class blueman-manager
windowrule = size 700 450, match:class pavucontrol
windowrule = size 700 450, match:class blueman-manager

# Keybindings
$mainMod = SUPER

# Applications
bind = $mainMod, T, exec, $terminal
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bindr = SUPER, SUPER_L, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, F, fullscreen, 0

# Random Wallpaper / Dynamic Theme Switcher
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wall.sh --random

# Terminal tools popup (Cava, Cmatrix, Btop)
bind = $mainMod SHIFT, B, exec, foot --app-id=float-term btop
bind = $mainMod, N, exec, foot --app-id=float-term cava
bind = $mainMod, X, exec, foot --app-id=float-term cmatrix

# Audio controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+ || pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- || pamixer -d 5
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle || pamixer -t
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness controls
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media Player controls
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Скриншот скопирован" || true
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Скриншот скопирован" || true

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

# Move active window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# Scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
