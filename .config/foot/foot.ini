# ==============================================================================
# Foot Terminal Configuration with Dynamic Wallpaper Colors & Blur/Transparency
# ==============================================================================

[main]
include=~/.config/foot/colors.ini
font=JetBrainsMono Nerd Font:size=13
pad=12x12 center

[colors-dark]
alpha=0.80
blur=yes

[cursor]
style=beam
beam-thickness=1.5
blink=yes
blink-rate=500

[mouse]
hide-when-typing=yes

[bell]
urgent=no
notify=no
