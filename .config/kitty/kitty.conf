# ==============================================================================
# Kitty Terminal Configuration with Dynamic Wallpaper Colors, Opacity & Blur
# ==============================================================================

# Dynamic color scheme from wallpaper
include colors.conf

# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Transparency & Blur
background_opacity 0.80
background_blur 1
dynamic_background_opacity yes

# Window Layout & Padding
window_padding_width 12
confirm_os_window_close 0
remember_window_size  yes
initial_window_width  850
initial_window_height 500

# Cursor & Mouse
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
mouse_hide_wait 3.0

# Audio Bell
enable_audio_bell no

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes
